[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperdigest"
version = "0.1.0"
description = "Benchmark 20 summarizers plus QA and RAG over research papers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.40", "sentencepiece>=0.2", "datasets>=2.18"]
dense = ["sentence-transformers>=2.6"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
paperdigest = "paperdigest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
